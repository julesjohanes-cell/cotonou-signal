# CI/CD du front Cotonou Signale, pensée pour répondre vite (environ 1 min au lieu de 3 à 4).
# - Deux jobs en parallèle : « Vérifications » (audit, règles des agents, lint, types, tests unitaires)
#   et « Build et e2e » (build de production puis parcours Playwright).
# - « Qualité » attend les deux et n'est vert que si les deux le sont : c'est le seul contrôle requis pour fusionner.
# - Ce qui rend la CI rapide :
#   · lint, types et tests unitaires tournent en même temps ;
#   · le cache de build Next (.next/cache) est réutilisé : un rebuild prend quelques secondes au lieu de ~25 s ;
#   · les types sont vérifiés une seule fois (tsc dans « Vérifications »), pas une deuxième fois pendant le build ;
#   · aucun navigateur à télécharger : Playwright utilise le Chrome déjà installé sur le runner ;
#   · les parcours e2e tournent en parallèle ;
#   · une PR qui reçoit un nouveau commit annule l'exécution précédente.
# - Chaque fusion sur main : même contrôle ; la machine de démo se met à jour seule (scripts/demo-continue.sh).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_PUBLIC_MOCKS: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verifications:
    name: Vérifications
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer (lockfile figé)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Audit des dépendances (failles hautes et critiques)
        run: pnpm audit --prod --audit-level high

      - name: Règles des agents (AGENTS.md uniquement)
        run: pnpm check:agents

      - name: Types d'API à jour avec le contrat (contrat/openapi.yaml)
        run: pnpm api:check

      - name: Lint, types et tests unitaires (en parallèle)
        run: |
          # Les trois contrôles tournent en même temps. Vert : journal replié. Rouge : journal affiché en entier.
          declare -A pid
          pnpm lint      > "$RUNNER_TEMP/lint.log"  2>&1 & pid[lint]=$!
          pnpm typecheck > "$RUNNER_TEMP/types.log" 2>&1 & pid[types]=$!
          pnpm test      > "$RUNNER_TEMP/tests.log" 2>&1 & pid[tests]=$!
          echec=0
          for controle in lint types tests; do
            if wait "${pid[$controle]}"; then
              echo "::group::✓ $controle"
              cat "$RUNNER_TEMP/$controle.log"
              echo "::endgroup::"
            else
              echec=1
              echo "::error title=Contrôle « $controle » en échec::voir le journal ci-dessous"
              cat "$RUNNER_TEMP/$controle.log"
            fi
          done
          exit "$echec"

  build-e2e:
    name: Build et e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Les types sont vérifiés par « Vérifications », en parallèle : le build ne les revérifie pas (voir next.config.ts).
      CI_TYPES_VERIFIES: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installer (lockfile figé)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Restaurer le cache de build Next
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        id: build
        run: pnpm build

      - name: Navigateur (Chrome du runner, rien à télécharger)
        run: |
          if [ -x /opt/google/chrome/chrome ]; then
            echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"
            /opt/google/chrome/chrome --version
          else
            # Runner sans Chrome : on installe le Chromium de Playwright (plus lent).
            pnpm exec playwright install --with-deps --only-shell chromium
          fi

      - name: Parcours de bout en bout
        run: pnpm test:e2e

      - name: Rapport e2e en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 3

      # Enregistré seulement sur main : les PR repartent du dernier build de main sans encombrer le stockage des caches.
      - name: Enregistrer le cache de build Next (main)
        if: always() && steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  qualite:
    # Seul contrôle requis par la protection de main. always() : une exécution annulée ou en échec reste rouge.
    name: Qualité
    if: always()
    needs: [verifications, build-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Résultat des deux jobs
        env:
          VERIFICATIONS: ${{ needs.verifications.result }}
          BUILD_E2E: ${{ needs.build-e2e.result }}
        run: |
          echo "Vérifications : $VERIFICATIONS · Build et e2e : $BUILD_E2E"
          [ "$VERIFICATIONS" = success ] && [ "$BUILD_E2E" = success ]
